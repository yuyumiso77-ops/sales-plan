<style>
/* Layout: 남색 헤더 밴드 + 전체 요약 숫자 + 상태 필터 + 행사 카드 목록 (행사 상세 페이지와 같은 색 체계) */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --fg:#1b2333; --muted:#5d6779; --line:#dbe1ea;
  --navy:#1f3864; --accent:#2f5597; --tint:#e4ebf5;
  --live:#1e7a46; --live-bg:#e3f3ea; --soon:#8a5a00; --soon-bg:#fff4d6; --done:#5d6779; --done-bg:#eceff4;
  --band-fg:#ffffff; --band-muted:#c6d2e6;
  --f-display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141d; --surface:#171e2b; --fg:#e6ebf3; --muted:#9aa5b8; --line:#2a3446;
  --navy:#16284a; --accent:#7fa4e0; --tint:#1f2c44;
  --live:#6fd39a; --live-bg:#163024; --soon:#f3c96b; --soon-bg:#3a2f12; --done:#9aa5b8; --done-bg:#222a38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141d; --surface:#171e2b; --fg:#e6ebf3; --muted:#9aa5b8; --line:#2a3446;
  --navy:#16284a; --accent:#7fa4e0; --tint:#1f2c44;
  --live:#6fd39a; --live-bg:#163024; --soon:#f3c96b; --soon-bg:#3a2f12; --done:#9aa5b8; --done-bg:#222a38; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--navy);color:var(--band-fg);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.band .wrap{padding-block:28px 48px}
.brand{display:flex;align-items:center;gap:16px}
.brand img.logo{height:56px;width:auto;flex:none}
@media (max-width:480px){.brand img.logo{height:42px}}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--band-muted);text-transform:uppercase}
h1{font-family:var(--f-display);font-size:clamp(22px,3.4vw,32px);font-weight:700;margin:6px 0 6px}
.sub{color:var(--band-muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:-28px}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:28px 0 14px}
.bar h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0 auto 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--fg);padding:7px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:grid;gap:14px;padding-bottom:48px}
.card{position:relative;display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card:hover{border-color:var(--accent)}
.card h3 a{color:inherit;text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0;border-radius:12px}
.share{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:flex-end}
.share button{font:inherit;font-size:12.5px;font-weight:500;background:var(--tint);color:var(--accent);border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer}
.share button:hover{border-color:var(--accent)}
.share a.fl{font-size:12.5px;font-weight:500;color:var(--accent);border:1px solid var(--line);border-radius:7px;padding:4px 10px;text-decoration:none;background:var(--surface)}
.share a.fl:hover{border-color:var(--accent)}
.share .msg{font-size:12px;color:var(--live)}
.share input{font:inherit;font-size:12px;width:220px;max-width:100%;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface);color:var(--fg)}
.card img{width:132px;height:132px;object-fit:cover;border-radius:8px;background:var(--tint);display:block}
.card .ph{width:132px;height:132px;border-radius:8px;background:var(--tint)}
.card .main{min-width:0}
.card h3{font-family:var(--f-display);font-size:18px;font-weight:600;margin:4px 0 2px}
.card .meta{color:var(--muted);font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:10px;font-variant-numeric:tabular-nums}
.stats div{min-width:0} .stats .l{font-size:11.5px;color:var(--muted)} .stats .v{font-weight:700}
.side{display:grid;gap:8px;justify-items:end;text-align:right}
.dday{font-family:var(--f-display);font-size:20px;font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.pill.live{color:var(--live);background:var(--live-bg)} .pill.soon{color:var(--soon);background:var(--soon-bg)} .pill.done{color:var(--done);background:var(--done-bg)}
.go{font-size:13px;color:var(--accent);font-weight:500}
.dl{font-size:12.5px;color:var(--muted)}
.dl a{color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
@media (max-width:640px){.card{grid-template-columns:84px minmax(0,1fr)}.card img,.card .ph{width:84px;height:84px}.side{grid-column:1/-1;justify-items:start;text-align:left;grid-auto-flow:column;justify-content:space-between;align-items:center}}
</style>

<script>
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const eok = n => (n/1e8).toFixed(2) + '억';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = new Date(); today.setHours(0,0,0,0);
const W = ['일','월','화','수','목','금','토'];
const dstr = d => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}(${W[d.getDay()]})`;
$('today').textContent = '오늘 ' + dstr(today);

function status(e){
  const s = day(e.start), t = day(e.end);
  if (today < s) { const n = Math.round((s - today) / 864e5); return {k:'soon', label:'예정', d:`D-${n}`}; }
  if (today > t) return {k:'done', label:'종료', d:'종료'};
  const n = Math.round((t - today) / 864e5); return {k:'live', label:'진행 중', d: n ? `종료 D-${n}` : '오늘 종료'};
}
let EV = [], SHARES = [], filt = '';
const shareUrl = token => location.origin + '/s/' + token + '/';
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-share]'); if (!b) return;
  ev.preventDefault();
  const url = shareUrl(b.dataset.share), box = b.parentElement;
  const done = m => { box.querySelector('.msg')?.remove(); const s = document.createElement('span'); s.className = 'msg'; s.setAttribute('role','status'); s.textContent = m; box.append(s); };
  const fallback = () => { box.querySelector('input')?.remove(); const i = document.createElement('input'); i.readOnly = true; i.value = url; i.setAttribute('aria-label','공유 링크'); box.append(i); i.select(); done('선택됨 · Ctrl+C로 복사'); };
  try { navigator.clipboard.writeText(url).then(() => done('복사했습니다'), fallback); } catch (e) { fallback(); }
});
function render(){
  const a = EV.filter(e => !filt || e.st.k === filt);
  $('list').innerHTML = a.length ? a.map(e => {
    const qty = (e.apparel?.qty||0) + (e.golf?.qty||0), sale = (e.apparel?.sale||0) + (e.golf?.sale||0), tag = (e.apparel?.tag||0) + (e.golf?.tag||0);
    const base = 'events/' + encodeURIComponent(e.slug) + '/';
    const sh = SHARES.filter(s => s.slug === e.slug && s.active !== false);
    return `<div class="card">
      ${e.cover ? `<img src="${base}${esc(e.cover)}" alt="" loading="lazy">` : '<div class="ph"></div>'}
      <div class="main">
        <div class="meta">${esc(e.store)} · ${esc(e.place||'')}</div>
        <h3><a href="${base}">${esc(e.title)}</a></h3>
        <div class="meta">${dstr(day(e.start))} ~ ${dstr(day(e.end))} · ${esc(e.type||'')}</div>
        <div class="stats">
          ${e.apparel ? `<div><div class="l">의류</div><div class="v">${fmt(e.apparel.qty)}장</div></div>` : ''}
          ${e.golf ? `<div><div class="l">골프화</div><div class="v">${fmt(e.golf.qty)}켤레</div></div>` : ''}
          <div><div class="l">행사가 합계</div><div class="v">${fmt(sale)}원</div></div>
          <div><div class="l">평균 할인율</div><div class="v">${tag ? Math.round((1-sale/tag)*1000)/10 : 0}%</div></div>
          ${e.target ? `<div><div class="l">목표 매출</div><div class="v">${fmt(e.target)}원</div></div>` : ''}
        </div>
      </div>
      <div class="side">
        <span class="pill ${e.st.k}">${e.st.label}</span>
        <span class="dday">${e.st.d}</span>
        <span class="go">상세 보기 →</span>
        <div class="share">
          <a class="fl" href="${base}download.zip" download>자료 전체 받기</a>
          ${e.excel ? `<a class="fl" href="${base}${e.excel.split('/').map(encodeURIComponent).join('/')}?dl=1">엑셀</a>` : ''}
          ${sh.map(s => `<button type="button" data-share="${esc(s.token)}">공유 링크 복사</button>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('') : '<p class="empty">해당하는 행사가 없습니다.</p>';
}
function kpis(){
  const act = EV.filter(e => e.st.k !== 'done');
  const q = act.reduce((s,e)=>s+(e.apparel?.qty||0)+(e.golf?.qty||0),0), sale = act.reduce((s,e)=>s+(e.apparel?.sale||0)+(e.golf?.sale||0),0);
  $('kpis').innerHTML = [
    ['전체 행사', EV.length + '건', `진행 중 ${EV.filter(e=>e.st.k==='live').length} · 예정 ${EV.filter(e=>e.st.k==='soon').length} · 종료 ${EV.filter(e=>e.st.k==='done').length}`],
    ['진행·예정 물량', fmt(q) + '개', '의류 + 골프화'],
    ['진행·예정 행사가', eok(sale), fmt(sale) + '원'],
    ['다음 행사', (()=>{ const n = EV.filter(e=>e.st.k!=='done').sort((x,y)=>x.start.localeCompare(y.start))[0]; return n ? n.st.d : '-'; })(),
      (()=>{ const n = EV.filter(e=>e.st.k!=='done').sort((x,y)=>x.start.localeCompare(y.start))[0]; return n ? esc(n.store) : '예정된 행사 없음'; })()],
  ].map(([l,v,s])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
}
document.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', () => {
  filt = b.dataset.st; document.querySelectorAll('[data-st]').forEach(x => x.setAttribute('aria-pressed', x === b)); render();
}));
fetch('shares.json', {cache:'no-store'}).then(r => r.ok ? r.json() : []).catch(() => []).then(s => { SHARES = Array.isArray(s) ? s : []; render(); });
fetch('events.json', {cache:'no-store'}).then(r => { if (!r.ok) throw 0; return r.json(); }).then(list => {
  const rank = {live:0, soon:1, done:2};
  EV = list.map(e => ({...e, st: status(e)})).sort((a,b) => rank[a.st.k]-rank[b.st.k] || (a.st.k==='done' ? b.start.localeCompare(a.start) : a.start.localeCompare(b.start)));
  kpis(); render();
}).catch(() => { $('list').innerHTML = '<p class="empty">행사 목록을 불러오지 못했습니다. 새로고침해 주세요.</p>'; });
</script>
